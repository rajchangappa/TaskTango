<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskTango | Master your day, one task at a time</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body class="bg-gray-200">
    <header class="w-full flex flex-col gap-2 bg-gray-100 p-2 md:p-6 lg:p-8">
      <strong class="text-2xl font-bold text-gray-500">TaskTango</strong>
      <p class="text-gray-400 text-xs md:text-sm lg:text-lg">
        Stay on top of your goals with instant filtering and automatic saving.
        Organize your workflow effortlessly without losing a beat.
      </p>
    </header>
    <!-- Main Content -->
    <main class="w-full flex flex-col bg-gray-100">
      <section class="w-full h-fit p-2 md:p-6 lg:p-8">
        <form id="add-task-form" class="w-full flex flex-col md:flex-row gap-1">
          <input
            type="text"
            id="task-form-input"
            placeholder="Add a new task..."
            class="p-3 rounded-md border border-gray-300 flex-1 lg:w-full focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm md:text-base lg:text-lg"
          />
          <button
            type="submit"
            class="py-1 px-4 bg-gray-500 text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            Add Task
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
